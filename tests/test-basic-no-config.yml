name: Test basic usage - no config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Stethoscope action (no config present)
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action completed (no config case)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (logs 'Config not found' and exits)
          # or fail gracefully — either way we just verify it ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and completed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
