name: Test basic usage - no config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Stethoscope action with no config
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action completed (no crash on missing config)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action reads stethoscope config; with no config file present,
          # it either returns early ("Config not found") or fails gracefully.
          # Either success or failure is acceptable — what matters is it doesn't
          # crash the runner itself (i.e., the step ran and produced an outcome).
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: ${{ steps.action.outcome }}"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
