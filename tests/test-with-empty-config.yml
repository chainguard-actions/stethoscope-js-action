name: Test with empty integrations config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal stethoscope config with no integrations
        run: |
          cat > .stethoscoperc << 'EOF'
          {
            "integrations": {}
          }
          EOF
          echo "Config file created:"
          cat .stethoscoperc
      - name: Create empty data directory
        run: mkdir -p data
      - name: Run Stethoscope action with empty config
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action completed successfully with empty config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with empty integrations config"
          else
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi
