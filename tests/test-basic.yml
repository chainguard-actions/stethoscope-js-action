name: Test basic usage - no config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Stethoscope action (no config present)
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (pass or fail gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail if no config is present, but it should not crash the runner
          # We just verify the step completed (either success or failure) without hanging
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action completed with outcome ${{ steps.action.outcome }}"
          else
            echo "FAIL: unexpected outcome ${{ steps.action.outcome }}"
            exit 1
          fi
