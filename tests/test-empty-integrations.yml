name: Test empty integrations config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create stethoscope config with empty integrations
        run: |
          cat > .stethoscoperc << 'EOF'
          {
            "integrations": {}
          }
          EOF
          echo "Config file created:"
          cat .stethoscoperc

      - name: Run Stethoscope action with empty integrations
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran and produced an outcome
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With an empty integrations config, the action should log
          # "Enabled integrations []" and attempt to generate API endpoints.
          # It may fail when trying to read the ./data directory (which doesn't exist),
          # but it should not crash the runner.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: ${{ steps.action.outcome }}"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
