name: Test empty integrations config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up stethoscope config with empty integrations and data dir
        run: |
          printf '{"integrations":{}}\n' > .stethoscoperc
          mkdir -p data

      - name: Run action with empty integrations
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME (expected success or failure)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
