name: Dependabot PR CI
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  label-approve:
    name: Label and approve minor/patch updates
    runs-on: ubuntu-18.04
    steps:
      - uses: koj-co/dependabot-pr-action@fdc117e45d5ee003c9a7d81fc3c111c95183b70c # master
        with:
          token: ${{ secrets.GH_PAT }}
          merge-minor: true
          merge-patch: true
