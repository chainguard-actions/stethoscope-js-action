name: Pull Request Labeler
on:
  - pull_request
  - pull_request_review
permissions:
  contents: read
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label all PRs
        uses: actions/labeler@2c2a2313b245ae5cb1ddbddf76be67b266211c91 # main
        with:
          repo-token: "${{ secrets.GH_PAT }}"
      - name: Label approved PRs
        uses: koj-co/label-approved-action@5e7f8b5ab37030de670f7ba6ffa911fa9a4848b6 # master
        with:
          labels: "merge"
        env:
          GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
