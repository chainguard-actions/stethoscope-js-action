name: Release Scheduler CI
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  releaseScheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-scheduler
        uses: koj-co/release-scheduler@c70ce29fbd1120532891e6b8efeca52d56ecc9e3 # master
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
