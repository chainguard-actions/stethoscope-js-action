name: Hotfix Branch Pull Request
on:
  push:
    branches-ignore:
      - master
      - production
permissions:
  contents: read
  pull-requests: write
jobs:
  auto-pull-request:
    name: PullRequestAction
    runs-on: ubuntu-latest
    steps:
      - name: pull-request-action
        uses: vsoch/pull-request-action@ebce8e4918a162c11be918e7ace8cc75fdc8d18c # 1.0.13
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_PREFIX: "hotfix-"
          PULL_REQUEST_BRANCH: "production"
          PULL_REQUEST_BODY: "🚀 Opening a pull request for this branch"
          PULL_REQUEST_REVIEWERS: "AnandChowdhary"
