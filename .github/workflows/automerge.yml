name: Merge PRs
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Automerge
        uses: pascalgn/automerge-action@c6f2699cc4c19ea7ce7f560dbebd85565b744377 # v0.13.0
        env:
          GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
          MERGE_LABELS: "merge,!work in progress,!wip"
          MERGE_REMOVE_LABELS: "merge"
          MERGE_METHOD: "merge"
          MERGE_COMMIT_MESSAGE: ":twisted_rightwards_arrows: Merge #{pullRequest.number} ({pullRequest.title})"
          MERGE_FORKS: false
          UPDATE_LABELS: "merge"
          UPDATE_METHOD: "merge"
      - name: Delete merged branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        with:
          branches: "!master, !production, *"
        env:
          GITHUB_TOKEN: "${{ secrets.GH_PAT }}"
