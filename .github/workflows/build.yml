name: Build CI
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-18.04
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2.3.4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}
      - name: Setup Node.js
        uses: actions/setup-node@c46424eee26de4078d34105d3de3cc4992202b1e # v2.1.4
        with:
          node-version: 14
      - name: Cache node modules
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Build package
        run: npm run package
      - name: Publish package
        uses: stefanzweifel/git-auto-commit-action@75802d269e7721b5146d08f6063ba3097c55ad2b # v4.8.0
        with:
          commit_message: ":rocket: Deploy new version [skip ci]"
          commit_user_name: Stethoscoper
          commit_user_email: stethoscope-js@anandchowdhary.com
          commit_author: Stethoscoper <stethoscope-js@anandchowdhary.com>
